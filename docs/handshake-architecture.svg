<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Handshake Wave 2 system architecture</title>
  <desc id="desc">The buyer app and Lace wallet connect to an off-chain Gmail receipt attester and a Compact marketplace contract on Midnight. The email stays off-chain. The contract verifies an attestation, protects against replay, and releases test tUSDC. An indexer returns public offer state to the app.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101820"/><stop offset="1" stop-color="#0b1016"/></linearGradient>
    <marker id="arrowMint" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91e5c2"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8ea8ff"/></marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#f4f7f8}.sub{font:16px Arial,sans-serif;fill:#b2bec8}.zone{font:700 14px Arial,sans-serif;letter-spacing:2px;fill:#91e5c2}.box{fill:#17222b;stroke:#34414b;stroke-width:1.5}.chain{fill:#18242b;stroke:#91e5c2;stroke-width:2}.t{font:700 18px Arial,sans-serif;fill:#f4f7f8}.d{font:14px Arial,sans-serif;fill:#b2bec8}.small{font:12px Arial,sans-serif;fill:#91e5c2}.arrow{fill:none;stroke:#91e5c2;stroke-width:2.5;marker-end:url(#arrowMint)}.read{fill:none;stroke:#8ea8ff;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrowBlue)}.hair{stroke:#34414b;stroke-width:1}
    </style>
  </defs>
  <rect width="1280" height="760" rx="26" fill="url(#bg)"/>
  <text class="title" x="54" y="60">Handshake | Wave 2 architecture</text>
  <text class="sub" x="54" y="91">A verified email claim authorizes a contract-controlled test-token payout.</text>

  <rect x="46" y="122" width="670" height="548" rx="18" fill="#0d141b" stroke="#28343d"/>
  <rect x="738" y="122" width="496" height="548" rx="18" fill="#0d141b" stroke="#28343d"/>
  <text class="zone" x="72" y="157">OFF-CHAIN EXPERIENCE &amp; VERIFICATION</text>
  <text class="zone" x="764" y="157">MIDNIGHT PREVIEW</text>

  <rect class="box" x="76" y="194" width="246" height="104" rx="14"/>
  <text class="t" x="96" y="230">Buyer app</text>
  <text class="d" x="96" y="256">Next.js offer + intent flow</text>
  <text class="d" x="96" y="278">Reads public market state</text>

  <rect class="box" x="388" y="194" width="278" height="104" rx="14"/>
  <text class="t" x="408" y="230">Lace wallet</text>
  <text class="d" x="408" y="256">Buyer approves transactions</text>
  <text class="d" x="408" y="278">Reservation · proof · cancel</text>

  <path class="arrow" d="M322 246 H378"/>
  <text class="small" x="327" y="230">prepare</text>

  <rect class="box" x="76" y="364" width="246" height="104" rx="14"/>
  <text class="t" x="96" y="400">Demo receipt service</text>
  <text class="d" x="96" y="426">Gmail SMTP sends a test email</text>
  <text class="d" x="96" y="448">Clearly marked: no payment</text>

  <rect class="box" x="388" y="364" width="278" height="104" rx="14"/>
  <text class="t" x="408" y="400">Buyer inbox</text>
  <text class="d" x="408" y="426">Buyer downloads original .eml</text>
  <text class="d" x="408" y="448">Uploads it to the attester</text>

  <path class="arrow" d="M322 416 H378"/>
  <text class="small" x="326" y="400">SMTP</text>

  <rect class="box" x="194" y="532" width="368" height="104" rx="14"/>
  <text class="t" x="216" y="568">Off-chain attester</text>
  <text class="d" x="216" y="594">Checks Gmail DKIM + signed trade fields</text>
  <text class="d" x="216" y="616">Returns a Jubjub Schnorr attestation</text>

  <path class="arrow" d="M527 468 V500 H460 V522"/>
  <text class="small" x="480" y="495">original email</text>
  <path class="arrow" d="M194 584 H60 V320 H194 V298"/>
  <text class="small" x="68" y="344">attester response</text>

  <text class="small" x="838" y="195">Maker pre-funds the offer with test tUSDC</text>
  <path class="arrow" d="M986 202 V220"/>
  <rect class="chain" x="782" y="230" width="408" height="230" rx="16"/>
  <text class="t" x="810" y="272">Compact marketplace</text>
  <text class="d" x="810" y="304">Escrowed tUSDC + buyer intent state</text>
  <line class="hair" x1="810" y1="322" x2="1160" y2="322"/>
  <text class="d" x="810" y="352">1  Check reservation and amount</text>
  <text class="d" x="810" y="380">2  Verify attester signature in-circuit</text>
  <text class="d" x="810" y="408">3  Reject replayed receipt / nullifier</text>
  <text class="d" x="810" y="436">4  Release tUSDC atomically</text>

  <path class="arrow" d="M666 246 H772"/>
  <text class="small" x="684" y="229">reserve intent</text>
  <path class="arrow" d="M666 278 H704 V430 H772"/>

  <rect class="box" x="844" y="526" width="284" height="90" rx="14"/>
  <text class="t" x="872" y="563">Midnight indexer</text>
  <text class="d" x="872" y="589">Feeds live state to the buyer app</text>
  <path class="read" d="M986 460 V516"/>
  <text class="small" x="1000" y="500" fill="#8ea8ff">read state</text>
  <line x1="728" y1="176" x2="728" y2="646" stroke="#f3bd78" stroke-width="1.5" stroke-dasharray="5 7"/>

  <text class="sub" x="54" y="711">Email contents stay off-chain. Recipient address, reservation amount, and offer state are public in this demo.</text>
</svg>
